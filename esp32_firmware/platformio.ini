; PlatformIO Project Configuration File for LT-FaultX ESP32
; Build with: pio run -e esp32dev
; Upload with: pio run -e esp32dev -t upload
; Monitor with: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Libraries
lib_deps = 
    bblanchon/ArduinoJson@^7.2.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Partition scheme (for OTA support if needed)
board_build.partitions = default_16MB.csv

; Flash frequency
board_build.f_flash = 80000000L

; Custom upload port (auto-detect if not specified)
; upload_port = COM3